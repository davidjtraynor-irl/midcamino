<!DOCTYPE html>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fdf6f3; min-height: 100vh; padding: 1.5rem 1rem; }
  .app { max-width: 480px; margin: 0 auto; }
  .logo { font-size: 26px; font-weight: 600; color: #b5451b; margin-bottom: 4px; }
  .tagline { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 1px solid #e8e8e5; border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 12px; }
  .section-label { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
  .person-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; margin-top: 6px; }
  .addr-wrap { flex: 1; position: relative; }
  .addr-wrap input { width: 100%; padding: 9px 58px 9px 11px; font-size: 14px; border: 1px solid #ddd; border-radius: 9px; background: #fafaf9; color: #1a1a1a; outline: none; font-family: inherit; }
  .addr-wrap input:focus { border-color: #b5451b; background: #fff; }
  .gps-btn { position: absolute; right: 30px; top: 9px; background: none; border: none; cursor: pointer; color: #aaa; font-size: 16px; line-height: 1; padding: 0; }
  .gps-btn:hover { color: #555; }
  .remove-btn { position: absolute; right: 8px; top: 7px; background: none; border: none; cursor: pointer; color: #ccc; font-size: 20px; line-height: 1; padding: 0; }
  .remove-btn:hover { color: #e05; }
  .add-person-btn { width: 100%; padding: 8px; font-size: 13px; border: 1px dashed #ccc; border-radius: 9px; background: transparent; color: #999; cursor: pointer; font-family: inherit; margin-top: 2px; }
  .add-person-btn:hover { border-color: #b5451b; color: #b5451b; background: #fceee9; }
  .modes { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .mode-btn { flex: 1; min-width: 70px; padding: 7px 4px; font-size: 12px; font-weight: 500; border: 1px solid #ddd; border-radius: 8px; background: transparent; color: #888; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .mode-btn.active { background: #fceee9; color: #b5451b; border-color: transparent; }
  .place-types { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .type-chip { padding: 5px 13px; font-size: 13px; border: 1px solid #ddd; border-radius: 99px; background: transparent; color: #888; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .type-chip.active { border-color: #b5451b; color: #b5451b; font-weight: 500; }
  .count-row { display: flex; align-items: center; gap: 12px; }
  .count-row label { font-size: 13px; color: #888; }
  .count-row input[type=range] { flex: 1; accent-color: #b5451b; }
  .count-val { font-size: 14px; font-weight: 600; min-width: 20px; text-align: right; color: #1a1a1a; }
  .search-btn { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 10px; border: none; background: #b5451b; color: #fff; cursor: pointer; margin-top: 4px; font-family: inherit; transition: opacity 0.15s; }
  .search-btn:hover { opacity: 0.88; }
  .search-btn:disabled { opacity: 0.4; cursor: default; }
  #map { width: 100%; height: 300px; border-radius: 14px; border: 1px solid #e8e8e5; margin: 14px 0 10px; display: none; }
  .result-card { background: #fff; border: 1px solid #e8e8e5; border-radius: 14px; padding: 1rem 1.25rem; margin-bottom: 10px; }
  .result-name { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
  .result-addr { font-size: 12px; color: #999; margin-bottom: 8px; }
  .travel-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .tchip { font-size: 12px; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  .tchip.ptype { background: #f5f0ff; color: #5b3fa8; }
  .rating-row { display: flex; align-items: center; gap: 5px; margin-top: 7px; }
  .stars { color: #FFD000; font-size: 13px; letter-spacing: 1px; }
  .rating-num { font-size: 13px; color: #999; }
  .status-msg { font-size: 13px; color: #999; text-align: center; padding: 1.5rem 0; display: none; }
  .error-msg { font-size: 13px; color: #b33; text-align: center; padding: 1rem 0; display: none; background: #fff5f5; border-radius: 8px; margin-top: 8px; }
  .reset-btn { width: 100%; padding: 9px; font-size: 13px; border: 1px solid #ddd; border-radius: 10px; background: transparent; color: #888; cursor: pointer; margin-top: 6px; font-family: inherit; display: none; }
  .reset-btn:hover { background: #fdf6f3; }
  .share-btn { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; border: none; background: #FFD000; color: #b5451b; cursor: pointer; margin-top: 8px; font-family: inherit; transition: opacity 0.15s; display: none; }
  .share-btn:hover { opacity: 0.88; }
  .share-invite { width: 100%; padding: 10px; font-size: 14px; font-weight: 600; border-radius: 10px; border: 1.5px dashed #b5451b; background: transparent; color: #b5451b; cursor: pointer; margin-top: 6px; font-family: inherit; transition: all 0.15s; display: none; }
  .share-invite:hover { background: #fceee9; }
  .session-bar { display: none; background: #fceee9; border: 1.5px solid #b5451b; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .session-bar-title { font-size: 12px; font-weight: 600; color: #b5451b; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .session-code { font-size: 22px; font-weight: 700; color: #b5451b; letter-spacing: 4px; text-align: center; margin: 6px 0; }
  .session-members { font-size: 13px; color: #8a3414; margin-bottom: 8px; }
  .session-member { display: inline-block; background: #b5451b; color: white; border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; margin: 2px 3px 2px 0; }
  .session-actions { display: flex; gap: 8px; }
  .session-copy-btn { flex: 1; padding: 8px; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; background: #b5451b; color: white; cursor: pointer; font-family: inherit; }
  .session-leave-btn { padding: 8px 14px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid #b5451b; background: transparent; color: #b5451b; cursor: pointer; font-family: inherit; }
  .session-join-bar { display: none; background: #fff; border: 1px solid #e8e8e5; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .session-join-row { display: flex; gap: 8px; align-items: center; }
  .session-join-row input { flex: 1; padding: 8px 12px; font-size: 16px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; text-align: center; }
  .session-join-row input:focus { border-color: #b5451b; }
  .session-join-btn { padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; background: #b5451b; color: white; cursor: pointer; font-family: inherit; }
  .start-session-btn { width: 100%; padding: 9px; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1.5px dashed #b5451b; background: transparent; color: #b5451b; cursor: pointer; font-family: inherit; margin-bottom: 10px; }
  .start-session-btn:hover { background: #fceee9; }
  .share-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: white; padding: 10px 20px; border-radius: 99px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; white-space: nowrap; }
  .share-toast.show { opacity: 1; }
  .result-card { cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s, background 0.1s; -webkit-tap-highlight-color: transparent; }
  .result-card:hover { border-color: #b5451b; box-shadow: 0 2px 12px rgba(181,69,27,0.10); }
  .result-card:active { background: #fceee9; }
  .result-card.active { border-color: #b5451b; box-shadow: 0 2px 12px rgba(181,69,27,0.15); background: #fdf6f3; }
  .tap-hint { font-size: 11px; color: #bbb; margin-top: 6px; }
  .card-expand { display: none; border-top: 1px solid #f0f0ee; margin: 8px -1.25rem -1rem; padding: 12px 1.25rem 1rem; }
  .card-expand.open { display: block; }
  .expand-actions { display: flex; gap: 8px; margin-bottom: 12px; }
  .expand-action { flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 600; border-radius: 8px; border: 1px solid #ddd; background: transparent; color: #555; cursor: pointer; font-family: inherit; text-align: center; text-decoration: none; display: block; }
  .expand-action:hover { background: #fdf6f3; }
  .expand-action.primary { background: #b5451b; color: #fff; border-color: transparent; }
  .expand-action.primary:hover { opacity: 0.88; background: #b5451b; }
  .expand-photos { display: flex; gap: 6px; overflow-x: auto; margin: 0 -1.25rem 12px; padding: 0 1.25rem; scrollbar-width: none; }
  .expand-photos::-webkit-scrollbar { display: none; }
  .expand-photo { width: 110px; height: 80px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
  .expand-hours { font-size: 12px; font-weight: 600; margin-bottom: 10px; }
  .expand-loading { font-size: 13px; color: #999; padding: 4px 0 8px; }
  .expand-reviews-link { font-size: 13px; color: #b5451b; font-weight: 600; text-decoration: none; display: block; text-align: center; padding: 6px 0 2px; }
  .expand-reviews-link:hover { opacity: 0.8; }
  .pac-container { border-radius: 10px !important; border: 1px solid #ddd !important; box-shadow: 0 4px 16px rgba(0,0,0,0.10) !important; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important; margin-top: 3px !important; }
  .pac-item { padding: 8px 12px !important; font-size: 13px !important; cursor: pointer; }
  .pac-item:hover { background: #f5f5f3 !important; }
  .pac-item-query { font-size: 13px !important; color: #1a1a1a !important; }
  .pac-matched { font-weight: 600 !important; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<body>
<div class="app">
  <div class="logo">
  <svg width="28" height="20" viewBox="0 0 56 40" style="vertical-align:middle;margin-right:6px;margin-bottom:3px">
    <path d="M 4 12 C 14 12 22 24 28 24 C 34 24 42 12 52 12" fill="none" stroke="#b5451b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="4" cy="12" r="4" fill="#b5451b" opacity="0.5"/>
    <circle cx="52" cy="12" r="4" fill="#b5451b" opacity="0.5"/>
    <circle cx="28" cy="24" r="10" fill="#FFD000"/>
    <circle cx="28" cy="24" r="4" fill="#b5451b"/>
  </svg>midcamino</div>
  <div class="tagline">find a spot that's fair for everyone</div>

  <!-- Session bar (shown when in a session) -->
  <div class="session-bar" id="session-bar">
    <div class="session-bar-title">Group session</div>
    <div class="session-code" id="session-code-display"></div>
    <div class="session-members" id="session-members"></div>
    <div class="session-actions">
      <button class="session-copy-btn" onclick="copySessionLink()">&#128279; Copy invite link</button>
      <button class="session-leave-btn" onclick="leaveSession()">Leave</button>
    </div>
  </div>

  <!-- Join session bar -->
  <div class="session-join-bar" id="session-join-bar">
    <div class="section-label" style="margin-bottom:8px">Join a group session</div>
    <div class="session-join-row">
      <input id="session-code-input" type="text" maxlength="6" placeholder="ABC123" oninput="this.value=this.value.toUpperCase()" />
      <button class="session-join-btn" onclick="joinSession()">Join</button>
    </div>
  </div>

  <div class="card">
    <div class="section-label">Locations</div>
    <div id="people-list"></div>
    <button class="add-person-btn" id="add-person-btn" onclick="addPerson()">+ Add another person</button>
  </div>

  <button class="start-session-btn" id="start-session-btn" onclick="toggleJoinBar()">&#128101; Plan with a group &mdash; share one link</button>

  <div class="card">
    <div class="section-label">Travel mode</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="DRIVING" onclick="selectMode(this)">Driving</button>
      <button class="mode-btn" data-mode="TRANSIT" onclick="selectMode(this)">Transit</button>
      <button class="mode-btn" data-mode="WALKING" onclick="selectMode(this)">Walking</button>
      <button class="mode-btn" data-mode="BICYCLING" onclick="selectMode(this)">Cycling</button>
    </div>
    <div class="section-label">Type of place</div>
    <div class="place-types">
      <button class="type-chip active" data-type="bar" onclick="toggleType(this)">Bar</button>
      <button class="type-chip" data-type="restaurant" onclick="toggleType(this)">Restaurant</button>
      <button class="type-chip" data-type="cafe" onclick="toggleType(this)">Cafe</button>
      <button class="type-chip" data-type="park" onclick="toggleType(this)">Park</button>
      <button class="type-chip" data-type="movie_theater" onclick="toggleType(this)">Cinema</button>
      <button class="type-chip" data-type="night_club" onclick="toggleType(this)">Club</button>
    </div>
    <div class="count-row">
      <label>Results</label>
      <input type="range" id="count-slider" min="1" max="10" step="1" value="3"
        oninput="document.getElementById('count-display').textContent=this.value" />
      <span class="count-val" id="count-display">3</span>
    </div>
  </div>

  <button class="search-btn" id="search-btn" onclick="doSearch()">Find a spot</button>
  <button class="share-invite" id="share-invite-btn" onclick="shareInvite()">&#128279; Invite others to add their location</button>
  <button class="reset-btn" id="reset-btn" onclick="resetApp()">Start over</button>
  <button class="share-btn" id="share-results-btn" onclick="shareResults()">&#127381; Share these results</button>
  <div class="share-toast" id="share-toast"></div>
  <div class="status-msg" id="status-msg"></div>
  <div class="error-msg" id="error-msg"></div>
  <div id="map"></div>
  <div id="results-list"></div>
</div>

<script>
const GKEY = 'AIzaSyCLqZ8CEafy_1_UZgYa-DeDUTI96p9DKHU';
const MAX_PEOPLE = 5;
const LABELS = 'ABCDE';
const COLORS = [
  { bg: '#fceee9', fg: '#b5451b' },
  { bg: '#fde8dc', fg: '#8a3414' },
  { bg: '#fdf3e3', fg: '#92600a' },
  { bg: '#f9ede8', fg: '#7a2f10' },
  { bg: '#fde0d0', fg: '#a03010' },
];

let travelMode = 'DRIVING';
let map, placesService, distMatSvc, geocoder;
let markers = [];
let people = [];
let nextId = 0;

function selectMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); travelMode = btn.dataset.mode;
}
function toggleType(btn) {
  btn.classList.toggle('active');
  if ([...document.querySelectorAll('.type-chip.active')].length === 0) btn.classList.add('active');
}
function getSelectedTypes() {
  return [...document.querySelectorAll('.type-chip.active')].map(b => b.dataset.type);
}
function setStatus(m) { const e = document.getElementById('status-msg'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }
function setError(m) { const e = document.getElementById('error-msg'); e.textContent = m; e.style.display = m ? 'block' : 'none'; }

function renderPeopleRows() {
  const list = document.getElementById('people-list');
  list.innerHTML = '';
  people.forEach((person, idx) => {
    const col = COLORS[idx];
    const label = LABELS[idx];
    person.label = label;
    person.ac = null; // reset so autocomplete re-attaches after re-render
    const row = document.createElement('div');
    row.className = 'person-row';
    row.id = 'person-row-' + person.id;
    row.innerHTML = `
      <div class="avatar" style="background:${col.bg};color:${col.fg}">${label}</div>
      <div class="addr-wrap">
        <input id="addr-${person.id}" type="text" placeholder="Person ${label}'s address" autocomplete="off" value="${person.addrText || ''}" />
        <button class="gps-btn" onclick="getGPS(${person.id})" title="Use my location">&#9678;</button>
        ${people.length > 2 && idx >= 1 ? `<button class="remove-btn" onclick="removePerson(${person.id})" title="Remove">&times;</button>` : ''}
      </div>
    `;
    list.appendChild(row);
    if (window.google && window.google.maps) attachAutocomplete(person);
  });
  document.getElementById('add-person-btn').style.display = people.length >= MAX_PEOPLE ? 'none' : 'block';
}

function addPerson() {
  if (people.length >= MAX_PEOPLE) return;
  // Save current input values before re-rendering
  people.forEach(p => { const el = document.getElementById('addr-' + p.id); if (el) p.addrText = el.value; });
  people.push({ id: nextId++, label: '', resolvedLoc: null, ac: null, addrText: '' });
  renderPeopleRows();
}

function removePerson(id) {
  const idx = people.findIndex(p => p.id === id);
  if (people.length <= 2 || idx < 1) return;
  // Save current input values and clear ac refs before re-rendering
  people.forEach(p => {
    const el = document.getElementById('addr-' + p.id);
    if (el) p.addrText = el.value;
    p.ac = null;
  });
  people.splice(idx, 1);
  renderPeopleRows();
}

function attachAutocomplete(person) {
  const input = document.getElementById('addr-' + person.id);
  if (!input || !window.google || !window.google.maps || !window.google.maps.places) return;
  person.ac = null;
  const ac = new google.maps.places.Autocomplete(input, { types: ['geocode', 'establishment'] });
  ac.addListener('place_changed', () => {
    const p = ac.getPlace();
    person.resolvedLoc = p.geometry ? p.geometry.location : null;
  });
  input.addEventListener('input', () => {
    person.resolvedLoc = null;
    person.addrText = input.value;
    checkShowInvite();
  });
  person.ac = ac;
}

function initMap() {
  geocoder = new google.maps.Geocoder();
  distMatSvc = new google.maps.DistanceMatrixService();
  people.forEach(p => { const el = document.getElementById('addr-' + p.id); if (el) p.addrText = el.value; });
  renderPeopleRows();
  if (window._pendingURLLoad) { loadFromURL(); window._pendingURLLoad = false; }
}

function checkShowInvite() {
  const filled = people.filter(p => {
    const el = document.getElementById('addr-' + p.id);
    return el && el.value.trim();
  }).length;
  document.getElementById('share-invite-btn').style.display = filled >= 1 ? 'block' : 'none';
}

function getGPS(id) {
  if (!navigator.geolocation) { setError('Geolocation not supported.'); return; }
  setStatus('Getting your location...');
  navigator.geolocation.getCurrentPosition(pos => {
    const latlng = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    geocoder.geocode({ location: latlng }, (results, status) => {
      setStatus('');
      if (status === 'OK' && results[0]) {
        const person = people.find(p => p.id === id);
        if (person) {
          document.getElementById('addr-' + id).value = results[0].formatted_address;
          person.addrText = results[0].formatted_address;
          person.resolvedLoc = results[0].geometry.location;
        }
      }
    });
  }, () => { setStatus(''); setError('Could not get GPS location.'); });
}

function geocodeAddr(addr) {
  return new Promise((resolve, reject) => {
    geocoder.geocode({ address: addr }, (results, status) => {
      if (status === 'OK') resolve(results[0].geometry.location);
      else reject('Could not find: ' + addr);
    });
  });
}

function getCentroid(locs) {
  const lat = locs.reduce((s, l) => s + l.lat(), 0) / locs.length;
  const lng = locs.reduce((s, l) => s + l.lng(), 0) / locs.length;
  return new google.maps.LatLng(lat, lng);
}

function interpolate(l1, l2, t) {
  return new google.maps.LatLng(
    l1.lat() + (l2.lat() - l1.lat()) * t,
    l1.lng() + (l2.lng() - l1.lng()) * t
  );
}

function searchNearby(center, types, maxPerType) {
  const searches = types.map(type => new Promise(resolve => {
    placesService.nearbySearch({ location: center, radius: 5000, type }, (results, status) => {
      resolve(status === 'OK' ? results.slice(0, maxPerType) : []);
    });
  }));
  return Promise.all(searches).then(all => {
    const seen = new Set();
    return all.flat().filter(p => {
      if (seen.has(p.place_id)) return false;
      seen.add(p.place_id); return true;
    });
  });
}

function getTravelTime(origin, dest, mode) {
  return new Promise((resolve, reject) => {
    distMatSvc.getDistanceMatrix({
      origins: [origin], destinations: [dest],
      travelMode: google.maps.TravelMode[mode],
    }, (res, status) => {
      if (status === 'REQUEST_DENIED') reject('Distance Matrix API access denied. Please enable it in Google Cloud Console.');
      else if (status === 'OK') {
        const el = res.rows[0].elements[0];
        resolve(el.status === 'OK' ? el.duration.value : 999999);
      } else resolve(999999);
    });
  });
}

function getPlaceLabel(types) {
  const map = { bar: 'Bar', night_club: 'Club', restaurant: 'Restaurant', cafe: 'Cafe', park: 'Park', movie_theater: 'Cinema', food: 'Restaurant', bakery: 'Cafe' };
  for (const t of (types || [])) if (map[t]) return map[t];
  return 'Place';
}

function fetchPlaceDetails(placeId) {
  return new Promise((resolve, reject) => {
    const dummy = document.createElement('div');
    const svc = new google.maps.places.PlacesService(dummy);
    svc.getDetails({
      placeId,
      fields: ['name', 'formatted_address', 'formatted_phone_number', 'website',
               'rating', 'reviews', 'photos', 'opening_hours', 'url', 'user_ratings_total',
               'reservable', 'serves_dinner', 'serves_lunch']
    }, (place, status) => {
      if (status === 'OK') resolve(place);
      else reject(status);
    });
  });
}

function starsHTML(r) {
  let s = '';
  for (let i = 0; i < 5; i++) s += i < Math.round(r) ? '★' : '☆';
  return s;
}
function clearMarkers() { markers.forEach(m => m.setMap(null)); markers = []; }

async function doSearch() {
  setError('');
  const count = parseInt(document.getElementById('count-slider').value);
  const addrs = people.map(p => document.getElementById('addr-' + p.id).value.trim());

  if (people.length < 2) { setError('Please add at least two people.'); return; }
  if (addrs.some(a => !a)) { setError('Please enter an address for everyone.'); return; }

  document.getElementById('search-btn').disabled = true;
  document.getElementById('results-list').style.display = 'none';
  document.getElementById('map').style.display = 'none';
  document.getElementById('reset-btn').style.display = 'none';
  setStatus('Finding locations...');

  try {
    const locs = await Promise.all(people.map((p, i) =>
      p.resolvedLoc ? Promise.resolve(p.resolvedLoc) : geocodeAddr(addrs[i])
    ));
    locs.forEach((loc, i) => { people[i].resolvedLoc = loc; });

    const centroid = getCentroid(locs);
    const mapEl = document.getElementById('map');
    mapEl.style.display = 'block';

    if (!map) {
      map = new google.maps.Map(mapEl, { zoom: 12, center: centroid, disableDefaultUI: true, zoomControl: true });
      await new Promise(resolve => google.maps.event.addListenerOnce(map, 'idle', resolve));
      placesService = new google.maps.places.PlacesService(map);
    } else {
      map.setCenter(centroid);
    }

    clearMarkers();
    locs.forEach((loc, i) => {
      const col = COLORS[i];
      markers.push(new google.maps.Marker({
        position: loc, map,
        label: { text: LABELS[i], color: col.fg, fontWeight: '600' }
      }));
    });

    setStatus('Finding nearby places...');
    const types = getSelectedTypes();
    const searchPoints = [centroid, ...locs.map(l => interpolate(l, centroid, 0.5))];
    const searchResults = await Promise.allSettled(searchPoints.map(pt => searchNearby(pt, types, 15)));

    const selectedTypes = getSelectedTypes();
    const EXCLUDE_CHAINS = new Set([
      "McDonald's","McDonalds","Burger King","KFC","Wendy's","Subway","Taco Bell",
      "Pizza Hut","Domino's","Domino's Pizza","Papa John's","Five Guys","Shake Shack",
      "Popeyes","Chick-fil-A","Dunkin'","Dunkin' Donuts","Tim Hortons","Panda Express",
      "Chipotle","Chipotle Mexican Grill","Wingstop","Buffalo Wild Wings","Little Caesars",
      "Church's Chicken","Sonic","Arby's","Hardee's","Carl's Jr.","Jack in the Box",
      "White Castle","Checkers","Rally's","Del Taco","Raising Cane's","Zaxby's","Culver's",
      "In-N-Out Burger","In-N-Out","Whataburger","Jersey Mike's","Jimmy John's","Quiznos",
      "Sbarro","Pollo Tropical","Firehouse Subs","Greggs","Pret A Manger","Pret",
      "Costa","Costa Coffee","Caffe Nero","Nero","Starbucks","Krispy Kreme",
      "Nando's","Nandos","Pizza Express","Wagamama","Yo! Sushi","Yo Sushi",
      "Leon","Itsu","Wasabi","Tortilla","Gourmet Burger Kitchen","GBK",
      "Byron","Honest Burgers","Shake Shack","Five Guys","Wimpy",
      "Harry Ramsden's","Harry Ramsdens","Fisherman's","The Codfather"
    ]);
    const filterUnwanted = selectedTypes.includes('restaurant') || selectedTypes.includes('cafe');
    const seen = new Set();
    const allCandidates = searchResults.flatMap(r => r.value || []).filter(p => {
      if (seen.has(p.place_id)) return false;
      seen.add(p.place_id);
      if (filterUnwanted) {
        const t = p.types || [];
        // Exclude by Google type tags
        if (t.includes('meal_takeaway') || t.includes('meal_delivery')) return false;
        // Exclude known chains regardless of how Google tags them
        if (EXCLUDE_CHAINS.has(p.name)) return false;
      }
      return true;
    });

    if (allCandidates.length === 0) throw 'No places found nearby. Try a different place type.';

    setStatus('Calculating travel times for ' + allCandidates.length + ' places...');

    const scored = await Promise.all(allCandidates.map(async place => {
      const ploc = place.geometry.location;
      const times = await Promise.all(locs.map(loc => getTravelTime(loc, ploc, travelMode)));
      const maxT = Math.max(...times);
      const minT = Math.min(...times);
      return { place, times, fairness: maxT - minT, total: times.reduce((s, t) => s + t, 0), maxT };
    }));

    scored.sort((a, b) => {
      const bandA = Math.floor(a.maxT / 60 / 10);
      const bandB = Math.floor(b.maxT / 60 / 10);
      if (bandA !== bandB) return bandA - bandB;
      return a.fairness - b.fairness;
    });

    // Cap at however many valid results exist — don't pad with poor matches
    const top = scored.slice(0, Math.min(count, scored.length));
    if (top.length === 0) throw 'No suitable places found. Try a different type or area.';
    lastResults = top;
    setStatus('');

    const listEl = document.getElementById('results-list');
    listEl.innerHTML = '';
    listEl.style.display = 'block';

    top.forEach((item, i) => {
      const { place, times } = item;
      markers.push(new google.maps.Marker({
        position: place.geometry.location, map,
        label: { text: String(i + 1), color: '#fff', fontWeight: '600', fontSize: '12px' }
      }));
      const timeChips = times.map((t, pi) => {
        const col = COLORS[pi];
        return `<span class="tchip" style="background:${col.bg};color:${col.fg}">${LABELS[pi]}: ${Math.round(t / 60)} min</span>`;
      }).join('');
      const card = document.createElement('div');
      card.className = 'result-card';
      const expandId = 'expand-' + i;
      card.innerHTML = `
        <div class="result-name">${i + 1}. ${place.name}</div>
        <div class="result-addr">${place.vicinity || ''}</div>
        <div class="travel-chips">${timeChips}<span class="tchip ptype">${getPlaceLabel(place.types)}</span></div>
        ${place.rating ? `<div class="rating-row"><span class="stars">${starsHTML(place.rating)}</span><span class="rating-num">${place.rating.toFixed(1)}</span></div>` : ''}
        <div class="tap-hint" id="hint-${i}">Tap for details &rsaquo;</div>
        <div class="card-expand" id="${expandId}"></div>
      `;
      let expanded = false;
      let loaded = false;
      card.addEventListener('click', () => {
        expanded = !expanded;
        const expandEl = document.getElementById(expandId);
        const hintEl = document.getElementById('hint-' + i);
        if (expanded) {
          expandEl.classList.add('open');
          hintEl.style.display = 'none';
          card.classList.add('active');
          // Zoom map
          if (map) { map.panTo(place.geometry.location); map.setZoom(16); }
          card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          if (!loaded) {
            loaded = true;
            expandEl.innerHTML = '<div class="expand-loading">Loading...</div>';
            fetchPlaceDetails(place.place_id).then(details => {
              const photosHTML = details.photos && details.photos.length
                ? `<div class="expand-photos">${details.photos.slice(0, 6).map(p =>
                    `<img class="expand-photo" src="${p.getUrl({ maxWidth: 300, maxHeight: 200 })}" loading="lazy" />`
                  ).join('')}</div>`
                : '';
              const hoursHTML = details.opening_hours
                ? `<div class="expand-hours" style="color:${details.opening_hours.isOpen() ? '#1a6b3a' : '#b33'}">${details.opening_hours.isOpen() ? 'Open now' : 'Closed now'}</div>`
                : '';
              const mapsUrl = details.url || 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(details.name);
              // Show reserve button only if Google's reservable field is true, or website contains booking keywords
              const bookingKeywords = ['resy.com','opentable.com','sevenrooms.com','tock.com','yelp.com/reservations','book','reserve'];
              const websiteIsBooking = details.website && bookingKeywords.some(k => details.website.toLowerCase().includes(k));
              const showReserve = details.reservable || websiteIsBooking;
              const reserveUrl = websiteIsBooking ? details.website : (details.url ? details.url : mapsUrl);
              const actionsHTML = `<div class="expand-actions">
                <a class="expand-action primary" href="${mapsUrl}" target="_blank">Open in Maps</a>
                ${showReserve ? `<a class="expand-action" style="background:#b5451b;color:#fff;border-color:transparent" href="${reserveUrl}" target="_blank">Reserve</a>` : ''}
                ${!websiteIsBooking && details.website ? `<a class="expand-action" href="${details.website}" target="_blank">Book</a>` : ''}
                ${details.formatted_phone_number ? `<a class="expand-action" href="tel:${details.formatted_phone_number}">Call</a>` : ''}
              </div>`;
              const reviewsLinkHTML = details.url
                ? `<a class="expand-reviews-link" href="${details.url}" target="_blank">See all reviews on Google &rsaquo;</a>`
                : '';
              expandEl.innerHTML = hoursHTML + actionsHTML + photosHTML + reviewsLinkHTML;
            }).catch(() => {
              expandEl.innerHTML = '<div class="expand-loading">Could not load details.</div>';
            });
          }
        } else {
          expandEl.classList.remove('open');
          hintEl.style.display = '';
          card.classList.remove('active');
        }
      });
      listEl.appendChild(card);
    });

    const bounds = new google.maps.LatLngBounds();
    markers.forEach(m => bounds.extend(m.getPosition()));
    map.fitBounds(bounds);
    document.getElementById('reset-btn').style.display = 'block';
    document.getElementById('share-results-btn').style.display = 'block';

  } catch (err) {
    setStatus('');
    setError(typeof err === 'string' ? err : (err.message || 'Something went wrong. Check your addresses and try again.'));
  }
  document.getElementById('search-btn').disabled = false;
}

<script>
// ── Supabase session logic ────────────────────────────────────────────────────
const SUPA_URL = 'https://spwsrsbrewpribrxdqpx.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwd3Nyc2JyZXdwcmlicnhkcXB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODEyMDYsImV4cCI6MjA5NDk1NzIwNn0.lg1lLAotii_H3jGcenwHtsIVnDu3dbHVoNSSVsRwPxQ';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentSession = null;   // { code, id }
let sessionChannel = null;   // realtime channel
let mySlot = -1;             // which person slot I own in this session

function generateCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length: 6}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
}

function toggleJoinBar() {
  const bar = document.getElementById('session-join-bar');
  const btn = document.getElementById('start-session-btn');
  const visible = bar.style.display === 'block';
  bar.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? '👥 Plan with a group — share one link' : '✕ Cancel';
  if (!visible) document.getElementById('session-code-input').focus();
}

async function startSession() {
  const code = generateCode();
  const myAddr = document.getElementById('addr-' + people[0].id)?.value.trim() || '';
  const addresses = [{ slot: 0, addr: myAddr, label: 'A' }];

  const { data, error } = await supa.from('sessions').insert({
    code,
    addresses: JSON.stringify(addresses)
  }).select().single();

  if (error) { showToast('Could not create session'); console.error(error); return; }

  currentSession = { code, id: data.id };
  mySlot = 0;
  showSessionBar(code, addresses);
  subscribeToSession(data.id);
  showToast('Session started!');
}

async function joinSession() {
  const code = document.getElementById('session-code-input').value.trim().toUpperCase();
  if (code.length < 6) { showToast('Please enter the full 6-character code'); return; }

  const { data, error } = await supa.from('sessions').select('*').eq('code', code).single();
  if (error || !data) { showToast('Session not found — check the code'); return; }

  const addresses = JSON.parse(data.addresses || '[]');
  const takenSlots = addresses.map(a => a.slot);
  mySlot = 0;
  while (takenSlots.includes(mySlot)) mySlot++;

  if (mySlot >= 5) { showToast('Session is full (max 5 people)'); return; }

  // Add my slot to addresses
  const myAddr = document.getElementById('addr-' + (people[mySlot] || people[people.length-1]).id)?.value.trim() || '';
  addresses.push({ slot: mySlot, addr: myAddr, label: LABELS[mySlot] });

  await supa.from('sessions').update({ addresses: JSON.stringify(addresses) }).eq('id', data.id);

  currentSession = { code, id: data.id };

  // Ensure enough person rows
  while (people.length <= mySlot) addPerson();

  // Fill in existing addresses
  addresses.forEach(a => {
    if (a.slot < people.length && a.addr) {
      const input = document.getElementById('addr-' + people[a.slot].id);
      if (input) { input.value = a.addr; people[a.slot].addrText = a.addr; }
    }
  });

  document.getElementById('session-join-bar').style.display = 'none';
  document.getElementById('start-session-btn').style.display = 'none';
  showSessionBar(code, addresses);
  subscribeToSession(data.id);
  showToast('Joined session!');
}

function subscribeToSession(sessionId) {
  if (sessionChannel) supa.removeChannel(sessionChannel);
  sessionChannel = supa.channel('session-' + sessionId)
    .on('postgres_changes', {
      event: 'UPDATE', schema: 'public', table: 'sessions', filter: `id=eq.${sessionId}`
    }, payload => {
      const addresses = JSON.parse(payload.new.addresses || '[]');
      updateSessionUI(addresses);
      // Fill in any new addresses other people added
      addresses.forEach(a => {
        if (a.slot !== mySlot && a.addr) {
          while (people.length <= a.slot) addPerson();
          const input = document.getElementById('addr-' + people[a.slot].id);
          if (input && !input.value.trim()) {
            input.value = a.addr;
            people[a.slot].addrText = a.addr;
            people[a.slot].resolvedLoc = null;
          }
        }
      });
      // Show toast when someone joins
      const myCount = JSON.parse(payload.old?.addresses || '[]').length;
      if (addresses.length > myCount) {
        const newcomer = addresses[addresses.length - 1];
        showToast(`Person ${newcomer.label} has joined! 👋`);
      }
    })
    .subscribe();
}

function showSessionBar(code, addresses) {
  document.getElementById('session-bar').style.display = 'block';
  document.getElementById('session-code-display').textContent = code;
  updateSessionUI(addresses);
}

function updateSessionUI(addresses) {
  const el = document.getElementById('session-members');
  if (addresses.length === 0) {
    el.textContent = 'Waiting for others to join…';
  } else {
    const joined = addresses.map(a => `<span class="session-member">${a.label}${a.addr ? ' ✓' : ''}</span>`).join('');
    el.innerHTML = `<strong>${addresses.length}</strong> ${addresses.length === 1 ? 'person' : 'people'} in session: ${joined}`;
  }
}

async function updateMyAddress() {
  if (!currentSession || mySlot < 0) return;
  const myAddr = document.getElementById('addr-' + people[mySlot]?.id)?.value.trim() || '';
  const { data } = await supa.from('sessions').select('addresses').eq('id', currentSession.id).single();
  const addresses = JSON.parse(data?.addresses || '[]');
  const mine = addresses.find(a => a.slot === mySlot);
  if (mine) mine.addr = myAddr;
  await supa.from('sessions').update({ addresses: JSON.stringify(addresses) }).eq('id', currentSession.id);
}

function copySessionLink() {
  if (!currentSession) return;
  const url = window.location.origin + window.location.pathname + '?session=' + currentSession.code;
  const msg = `Join my Midcamino session to find a fair meetup spot! Tap the link and add your location: ${url}`;
  if (navigator.share) {
    navigator.share({ title: 'Midcamino', text: msg, url }).catch(() => copyToClipboard(msg));
  } else {
    copyToClipboard(msg);
  }
}

async function leaveSession() {
  if (sessionChannel) { supa.removeChannel(sessionChannel); sessionChannel = null; }
  currentSession = null; mySlot = -1;
  document.getElementById('session-bar').style.display = 'none';
  document.getElementById('start-session-btn').style.display = 'block';
  showToast('Left session');
}

// Check URL for session code on load
async function checkSessionFromURL() {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('session');
  if (!code) return;
  // Pre-fill the join input and trigger join
  document.getElementById('session-code-input').value = code.toUpperCase();
  document.getElementById('session-join-bar').style.display = 'block';
  document.getElementById('start-session-btn').textContent = '✕ Cancel';
  showToast('Tap Join to enter the session');
}

// Wire up: update session when my address changes
const _origAttach = attachAutocomplete;
attachAutocomplete = function(person) {
  _origAttach(person);
  const input = document.getElementById('addr-' + person.id);
  if (input) {
    input.addEventListener('change', () => {
      if (currentSession && people.indexOf(person) === mySlot) updateMyAddress();
    });
  }
};

  if (visible) {
    bar.style.display = 'none';
    btn.textContent = '👥 Plan with a group — share one link';

    bar.innerHTML = `
      <div class="section-label" style="margin-bottom:10px">Group session</div>
      <button class="session-copy-btn" style="width:100%;margin-bottom:8px" onclick="startSession()">&#10133; Start a new session</button>
      <div style="text-align:center;font-size:12px;color:#aaa;margin-bottom:8px">— or join an existing one —</div>
      <div class="session-join-row">
        <input id="session-code-input" type="text" maxlength="6" placeholder="ABC123" oninput="this.value=this.value.toUpperCase()" />
        <button class="session-join-btn" onclick="joinSession()">Join</button>
      </div>`;
    bar.style.display = 'block';
    btn.textContent = '✕ Cancel';
    setTimeout(() => document.getElementById('session-code-input')?.focus(), 100);
  }
};

checkSessionFromURL();
</script>
